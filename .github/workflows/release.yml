name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Validate tag and package version
        id: release
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "${checkout_commit}" != "${release_commit}" ]]; then
            echo "::error::Checked-out commit ${checkout_commit} does not match release tag commit ${release_commit}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::Release commit ${release_commit} is not on origin/main."
            exit 1
          fi

          if [[ "${package_version}" == *-* ]]; then
            npm_tag="next"
            is_prerelease="true"
          else
            npm_tag="latest"
            is_prerelease="false"
          fi

          {
            echo "package_name=${package_name}"
            echo "package_version=${package_version}"
            echo "release_commit=${release_commit}"
            echo "npm_tag=${npm_tag}"
            echo "is_prerelease=${is_prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Extract lifecycle smoke attestation from annotated tag
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_type="$(git cat-file -t "${tag_ref}" 2>/dev/null || true)"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must be an annotated tag."
            exit 1
          fi

          attestation_path="${RUNNER_TEMP}/akk-live-lifecycle-attestation.txt"
          TAG_REF="${tag_ref}" ATTESTATION_PATH="${attestation_path}" node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const tagObject = execFileSync(
            "git",
            ["cat-file", "tag", process.env.TAG_REF],
            { encoding: null, stdio: ["ignore", "pipe", "inherit"] }
          );
          const separator = tagObject.indexOf(Buffer.from("\n\n"));
          if (separator < 0) {
            throw new Error("annotated tag object has no message separator");
          }
          fs.writeFileSync(
            process.env.ATTESTATION_PATH,
            tagObject.subarray(separator + 2),
            { mode: 0o600 }
          );
          NODE

      - name: Verify lifecycle smoke attestation
        shell: bash
        run: |
          node scripts/verify-lifecycle-smoke-evidence.js \
            --attestation "${RUNNER_TEMP}/akk-live-lifecycle-attestation.txt" \
            --expected-commit "${RELEASE_COMMIT}" \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --require-matrix \
            --max-age-hours 72
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}

      - name: Publish npm package with provenance
        shell: bash
        run: |
          package_spec="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          if npm view "${package_spec}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            published_git_head="$(npm view "${package_spec}" gitHead --registry=https://registry.npmjs.org)"
            if [[ "${published_git_head}" != "${RELEASE_COMMIT}" ]]; then
              echo "::error::${package_spec} is already published from ${published_git_head:-an unknown commit}."
              exit 1
            fi
            echo "${package_spec} is already published from this commit; skipping npm publish."
          else
            npm publish \
              --access public \
              --provenance \
              --tag "${NPM_TAG}" \
              --registry=https://registry.npmjs.org
          fi
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; nothing to do."
          else
            release_args=(
              "${GITHUB_REF_NAME}"
              --repo "${GITHUB_REPOSITORY}"
              --generate-notes
              --verify-tag
            )
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.publish.outputs.is_prerelease }}
