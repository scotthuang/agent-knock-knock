name: Verify coordinated release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  release:
    # Full tests are reserved for an actual publication candidate (AGENTS.md).
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.0'
      - name: Install isolated build dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Prepare unpublished core for connector checks
        run: |
          mkdir -p "$RUNNER_TEMP/akk-release"
          npm run build
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/akk-release" > "$RUNNER_TEMP/akk-release/core-candidate.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          artifacts = pathlib.Path(os.environ['RUNNER_TEMP']) / 'akk-release'
          pack = json.loads((artifacts / 'core-candidate.json').read_text())[0]
          archive = artifacts / pack['filename']
          for connector in ['pi', 'deepseek-harness']:
              folder = root / 'connectors' / connector
              lock = folder / 'package-lock.json'
              original = lock.read_bytes()
              data = json.loads(original)
              core = data['packages']['node_modules/@scotthuang/agent-knock-knock']
              assert core['version'] == pack['version']
              core.update(resolved=archive.as_uri(), integrity=pack['integrity'])
              try:
                  lock.write_text(json.dumps(data, indent=2) + '\n')
                  subprocess.run(['npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'], cwd=folder, check=True)
              finally:
                  lock.write_bytes(original)
          PY
      - name: Run required publication gates
        run: |
          set -o pipefail
          npm run test:release 2>&1 | tee "$RUNNER_TEMP/akk-release/release-gate.log"
          npm run typecheck
          npm run validate:architecture
          npm run validate:refactor-evidence
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/akk-release/package-dry-run.json"
          git diff --exit-code
      - name: Freeze tested packages
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          artifacts = pathlib.Path(os.environ['RUNNER_TEMP']) / 'akk-release'
          original = json.loads((artifacts / 'core-candidate.json').read_text())[0]
          checksums = []
          for kind, folder in [('core', '.'), ('pi', 'connectors/pi'), ('dsh', 'connectors/deepseek-harness')]:
              packed = subprocess.check_output(['npm', 'pack', '--ignore-scripts', '--json', '--pack-destination', str(artifacts)], cwd=root / folder, text=True)
              meta = json.loads(packed)[0]
              if kind == 'core':
                  assert meta['integrity'] == original['integrity'], 'core changed during release gates'
              archive = artifacts / meta['filename']
              sha = hashlib.sha256(archive.read_bytes()).hexdigest()
              checksums.append(sha + '  ' + meta['filename'])
              (artifacts / (kind + '-frozen.json')).write_text(json.dumps({'name': meta['name'], 'version': meta['version'], 'filename': meta['filename'], 'integrity': meta['integrity'], 'sha256': sha, 'bytes': archive.stat().st_size, 'files': len(meta['files'])}, indent=2) + '\n')
          (artifacts / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n')
          (artifacts / 'source.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'head': os.environ['HEAD_SHA'], 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'node': subprocess.check_output(['node', '--version'], text=True).strip()}, indent=2) + '\n')
          PY
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ github.run_id }}
          path: ${{ runner.temp }}/akk-release
          if-no-files-found: warn
