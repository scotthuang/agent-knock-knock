# Use this workflow after configuring this repository as the package's trusted
# OIDC publisher in ClawHub.
name: ClawHub Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        required: true
        type: boolean
        default: true

jobs:
  prepare:
    name: Test and build ClawHub package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_channel: ${{ steps.release.outputs.release_channel }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      package_version: ${{ steps.release.outputs.package_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release ref and resolve channel
        id: release
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_ref="refs/tags/v${package_version}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::ClawHub releases must run from ${expected_ref}; received ${GITHUB_REF}."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "${checkout_commit}" != "${release_commit}" ]]; then
            echo "::error::Checked-out commit ${checkout_commit} does not match release tag commit ${release_commit}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::Release commit ${release_commit} is not on origin/main."
            exit 1
          fi

          if [[ "${package_version}" == *-* ]]; then
            release_channel="beta"
          else
            release_channel="latest"
          fi
          echo "Publishing ${package_version} on the ClawHub ${release_channel} channel."
          {
            echo "release_channel=${release_channel}"
            echo "release_commit=${release_commit}"
            echo "package_version=${package_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Extract lifecycle smoke attestation from annotated tag
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_type="$(git cat-file -t "${tag_ref}" 2>/dev/null || true)"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must be an annotated tag."
            exit 1
          fi

          attestation_path="${RUNNER_TEMP}/akk-live-lifecycle-attestation.txt"
          TAG_REF="${tag_ref}" ATTESTATION_PATH="${attestation_path}" node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const tagObject = execFileSync(
            "git",
            ["cat-file", "tag", process.env.TAG_REF],
            { encoding: null, stdio: ["ignore", "pipe", "inherit"] }
          );
          const separator = tagObject.indexOf(Buffer.from("\n\n"));
          if (separator < 0) {
            throw new Error("annotated tag object has no message separator");
          }
          fs.writeFileSync(
            process.env.ATTESTATION_PATH,
            tagObject.subarray(separator + 2),
            { mode: 0o600 }
          );
          NODE

      - name: Verify lifecycle smoke attestation
        shell: bash
        run: |
          node scripts/verify-lifecycle-smoke-evidence.js \
            --attestation "${RUNNER_TEMP}/akk-live-lifecycle-attestation.txt" \
            --expected-commit "${RELEASE_COMMIT}" \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --require-matrix \
            --max-age-hours 72
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}

      - name: Validate ClawHub package
        run: npm run clawhub:validate

      - name: Pack prebuilt plugin
        shell: bash
        run: |
          mkdir -p clawhub-package
          npm pack \
            --ignore-scripts \
            --pack-destination clawhub-package

      - name: Upload prebuilt plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clawhub-package
          path: clawhub-package/*.tgz
          if-no-files-found: error

  publish:
    name: Publish ClawHub package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned ClawHub CLI
        run: npm ci --ignore-scripts

      - name: Build lifecycle evidence verifier
        run: npm run build

      - name: Reverify lifecycle smoke attestation before publishing
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_type="$(git cat-file -t "${tag_ref}" 2>/dev/null || true)"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must be an annotated tag."
            exit 1
          fi

          release_commit="$(git rev-parse "${tag_ref}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "${checkout_commit}" != "${release_commit}" || "${release_commit}" != "${EXPECTED_RELEASE_COMMIT}" ]]; then
            echo "::error::Checkout, release tag, and prepared artifact commits do not match."
            exit 1
          fi

          attestation_path="${RUNNER_TEMP}/akk-live-lifecycle-attestation.txt"
          TAG_REF="${tag_ref}" ATTESTATION_PATH="${attestation_path}" node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const tagObject = execFileSync(
            "git",
            ["cat-file", "tag", process.env.TAG_REF],
            { encoding: null, stdio: ["ignore", "pipe", "inherit"] }
          );
          const separator = tagObject.indexOf(Buffer.from("\n\n"));
          if (separator < 0) {
            throw new Error("annotated tag object has no message separator");
          }
          fs.writeFileSync(
            process.env.ATTESTATION_PATH,
            tagObject.subarray(separator + 2),
            { mode: 0o600 }
          );
          NODE

          node scripts/verify-lifecycle-smoke-evidence.js \
            --attestation "${attestation_path}" \
            --expected-commit "${release_commit}" \
            --expected-version "${PACKAGE_VERSION}" \
            --require-matrix \
            --max-age-hours 72
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}

      - name: Download prebuilt plugin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: clawhub-package
          path: clawhub-package

      - name: Publish package
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(clawhub-package/*.tgz)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one ClawHub package archive, found ${#packages[@]}." >&2
            exit 1
          fi

          publish_args=(
            package publish "${GITHUB_WORKSPACE}/${packages[0]}"
            --family code-plugin
            --tags "${RELEASE_CHANNEL}"
            --topics "tmux,codex,claude-code,agent-orchestration,terminal-handoff"
            --source-repo "${GITHUB_REPOSITORY}"
            --source-commit "${RELEASE_COMMIT}"
            --source-ref "${GITHUB_REF}"
            --json
          )
          if [[ "${DRY_RUN}" == "true" ]]; then
            publish_args+=(--dry-run)
          fi

          ./node_modules/.bin/clawhub "${publish_args[@]}"

          if [[ "${DRY_RUN}" != "true" ]]; then
            readme_url="https://clawhub.ai/api/v1/packages/%40scotthuang%2Fagent-knock-knock/file?path=README.md&preview=1&version=${PACKAGE_VERSION}"
            curl --fail --silent --show-error --retry 10 --retry-all-errors \
              --retry-delay 3 --retry-max-time 60 \
              "${readme_url}" |
              grep --fixed-strings "# Agent Knock Knock"

            if [[ "${RELEASE_CHANNEL}" == "latest" ]]; then
              default_readme_url="https://clawhub.ai/api/v1/packages/%40scotthuang%2Fagent-knock-knock/file?path=README.md&preview=1"
              curl --fail --silent --show-error --retry 10 --retry-all-errors \
                --retry-delay 3 --retry-max-time 60 \
                "${default_readme_url}" |
                grep --fixed-strings "# Agent Knock Knock"
            fi
          fi
