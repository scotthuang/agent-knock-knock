# The first ClawHub release must be published manually. Use this workflow only
# after configuring this repository as the package's trusted OIDC publisher.
name: ClawHub Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        required: true
        type: boolean
        default: true

jobs:
  prepare:
    name: Test and build ClawHub package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_channel: ${{ steps.release.outputs.release_channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Resolve release channel
        id: release
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${package_version}" == *-* ]]; then
            release_channel="beta"
          else
            release_channel="latest"
          fi
          echo "Publishing ${package_version} on the ClawHub ${release_channel} channel."
          echo "release_channel=${release_channel}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Pack prebuilt plugin
        shell: bash
        run: |
          mkdir -p clawhub-package
          npm pack \
            --ignore-scripts \
            --pack-destination clawhub-package

      - name: Upload prebuilt plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clawhub-package
          path: clawhub-package/*.tgz
          if-no-files-found: error

  publish:
    name: Publish ClawHub package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned ClawHub CLI
        run: npm ci --ignore-scripts

      - name: Download prebuilt plugin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: clawhub-package
          path: clawhub-package

      - name: Publish package
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(clawhub-package/*.tgz)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one ClawHub package archive, found ${#packages[@]}." >&2
            exit 1
          fi

          publish_args=(
            package publish "${packages[0]}"
            --family code-plugin
            --owner scotthuang
            --tags "${RELEASE_CHANNEL}"
            --source-repo "${GITHUB_REPOSITORY}"
            --source-commit "${GITHUB_SHA}"
            --source-ref "${GITHUB_REF}"
            --json
          )
          if [[ "${DRY_RUN}" == "true" ]]; then
            publish_args+=(--dry-run)
          fi

          ./node_modules/.bin/clawhub "${publish_args[@]}"
